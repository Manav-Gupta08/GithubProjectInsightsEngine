version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=8000
      - AI_INSIGHTS_ENABLED=${AI_INSIGHTS_ENABLED:true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  # ── Dev-only: run frontend separately with hot-reload ────────
  # Comment out in production (the Docker image serves built files).
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev   # only starts with: docker compose --profile dev up
